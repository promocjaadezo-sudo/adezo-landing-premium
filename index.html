<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ADEZO — Projekt wejścia premium</title>
  <meta name="description" content="Ekskluzywne drzwi wejściowe ADEZO projektowane pod architekturę domu. Umów konsultację premium." />

  <style>
    :root{
      --bg:#0b0b0a;
      --bg-soft:#151311;
      --text:#f5f0e8;
      --muted:#b9afa1;
      --gold:#c8a667;
      --line:rgba(245,240,232,.16);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,Arial,sans-serif;
      letter-spacing:-.02em;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    .page{
      overflow:hidden;
    }

    .nav{
      position:fixed;
      top:0;
      left:0;
      right:0;
      z-index:20;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:22px 5vw;
      background:rgba(8,8,7,.48);
      backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(245,240,232,.06);
    }

    .logo{
      font-size:23px;
      letter-spacing:.18em;
      font-weight:600;
      line-height:1;
    }

    .logo small{
      display:block;
      font-size:9px;
      letter-spacing:.26em;
      color:var(--muted);
      margin-top:6px;
    }

    .nav-links{
      display:flex;
      gap:34px;
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--muted);
    }

    .nav-cta{
      border:1px solid rgba(200,166,103,.55);
      padding:12px 18px;
      color:var(--gold);
      transition:.35s ease;
    }

    .nav-cta:hover{
      background:rgba(200,166,103,.12);
    }

    .hero{
      min-height:92vh;
      position:relative;
      display:grid;
      grid-template-columns:1.05fr .95fr;
      align-items:center;
      padding:120px 5vw 70px;
      gap:60px;
      background:radial-gradient(circle at 75% 20%,rgba(200,166,103,.14),transparent 38%),var(--bg);
    }

    .hero-copy{
      max-width:760px;
      z-index:2;
    }

    .eyebrow{
      color:var(--gold);
      text-transform:uppercase;
      letter-spacing:.22em;
      font-size:12px;
      margin-bottom:26px;
    }

    h1{
      font-family:Georgia,'Times New Roman',serif;
      font-weight:400;
      font-size:clamp(44px,5.5vw,82px);
      line-height:.96;
      margin:0 0 30px;
    }

    h2{
      font-family:Georgia,'Times New Roman',serif;
      font-weight:400;
      font-size:clamp(36px,4vw,68px);
      line-height:1;
      margin:0;
    }

    .lead{
      font-size:clamp(18px,2vw,24px);
      line-height:1.45;
      color:var(--muted);
      max-width:590px;
      margin-bottom:42px;
    }

    .text-cta{
      display:inline-flex;
      align-items:center;
      gap:14px;
      color:var(--text);
      font-size:17px;
      padding-bottom:8px;
      border-bottom:1px solid var(--gold);
      transition:.35s ease;
    }

    .text-cta:hover{
      color:var(--gold);
      transform:translateX(4px);
    }

    .video-card{
      position:relative;
      z-index:2;
      border:1px solid var(--line);
      border-radius:34px;
      min-height:650px;
      overflow:hidden;
      background:#111;
      box-shadow:0 40px 120px rgba(0,0,0,.45);
    }

    .video-card video{
      width:100%;
      height:100%;
      min-height:650px;
      object-fit:cover;
      display:block;
      filter:brightness(.68) contrast(1.08);
    }

    .play-note{
      position:absolute;
      left:30px;
      bottom:30px;
      color:var(--text);
      font-size:13px;
      letter-spacing:.08em;
      text-transform:uppercase;
      background:rgba(0,0,0,.36);
      border:1px solid rgba(245,240,232,.18);
      border-radius:999px;
      padding:13px 18px;
      backdrop-filter:blur(12px);
    }

    section{
      padding:110px 5vw;
    }

    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:end;
      gap:40px;
      margin-bottom:44px;
    }

    .section-desc{
      color:var(--muted);
      max-width:430px;
      line-height:1.6;
      font-size:16px;
    }

    .projects{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:20px;
    }

    .project{
      min-height:460px;
      border-radius:24px;
      overflow:hidden;
      border:1px solid var(--line);
      position:relative;
      background-size:cover;
      background-position:center;
      transition:transform .65s ease,border-color .65s ease,filter .65s ease;
    }

    .project:hover{
      transform:scale(1.025);
      border-color:rgba(200,166,103,.35);
      filter:brightness(1.08);
    }

    .project:after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(to top,rgba(0,0,0,.78),transparent 62%);
    }

    .project-name{
      position:absolute;
      z-index:2;
      left:26px;
      bottom:24px;
    }

    .project-name strong{
      display:block;
      font-family:Georgia,serif;
      font-size:30px;
      font-weight:400;
      letter-spacing:.08em;
    }

    .project-name small{
      color:var(--muted);
    }

    .brand{
      background:var(--bg-soft);
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
    }

    .features{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:18px;
      margin-top:50px;
    }

    .feature{
      border:1px solid var(--line);
      border-radius:20px;
      padding:34px 26px;
      min-height:190px;
      transition:.45s ease;
    }

    .feature:hover{
      border-color:rgba(200,166,103,.35);
      background:rgba(255,255,255,.025);
    }

    .feature b{
      display:block;
      color:var(--gold);
      font-size:34px;
      margin-bottom:18px;
      font-family:Georgia,serif;
      font-weight:400;
    }

    .feature p{
      color:var(--muted);
      line-height:1.55;
      margin:0;
    }

    .process{
      display:grid;
      grid-template-columns:.8fr 1.2fr;
      gap:22px;
      align-items:stretch;
    }

    .process-text{
      border:1px solid var(--line);
      border-radius:24px;
      padding:42px;
      background:rgba(255,255,255,.025);
    }

    .process-grid{
      display:block;
      width:100%;
    }

    .process-grid img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      border-radius:28px;
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 30px 80px rgba(0,0,0,.35);
      filter:brightness(.74) contrast(1.04);
    }

    .form-wrap{
      display:grid;
      grid-template-columns:.9fr 1.1fr;
      gap:70px;
      align-items:start;
    }

    form{
      border:1px solid var(--line);
      border-radius:26px;
      padding:34px;
      background:rgba(255,255,255,.025);
    }

    label{
      display:block;
      color:var(--muted);
      font-size:13px;
      margin:0 0 8px;
    }

    input,select{
      width:100%;
      background:transparent;
      border:none;
      border-bottom:1px solid rgba(245,240,232,.28);
      padding:14px 0 16px;
      color:var(--text);
      font-size:17px;
      outline:none;
      margin-bottom:24px;
    }

    select option{
      color:#111;
    }

    button{
      background:transparent;
      border:none;
      color:var(--text);
      font-size:17px;
      padding:0 0 8px;
      border-bottom:1px solid var(--gold);
      cursor:pointer;
      margin-top:10px;
      transition:.35s ease;
    }

    button:hover{
      color:var(--gold);
      transform:translateX(4px);
    }

    .form-note{
      margin-top:22px;
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    .premium-line{
      margin-top:28px;
      color:var(--gold);
      font-size:13px;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .trust{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
      padding:0 5vw 70px;
    }

    .trust div{
      border-top:1px solid var(--line);
      padding-top:24px;
      color:var(--muted);
      line-height:1.5;
    }

    .trust strong{
      display:block;
      color:var(--text);
      margin-bottom:8px;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-size:13px;
    }

    .sticky-mobile{
      display:none;
    }

    footer{
      padding:46px 5vw;
      border-top:1px solid var(--line);
      color:var(--muted);
      display:flex;
      justify-content:space-between;
    }

    @media(max-width:900px){

      .nav{
        padding:18px 5vw;
      }

      .nav-links,.nav-cta{
        display:none;
      }

      .hero{
        grid-template-columns:1fr;
        min-height:auto;
        padding-top:108px;
        padding-bottom:54px;
        gap:34px;
      }

      .lead{
        margin-bottom:30px;
      }

      .video-card,
      .video-card video{
        min-height:420px;
        border-radius:22px;
      }

      .projects,
      .features,
      .form-wrap,
      .process,
      .trust{
        grid-template-columns:1fr;
      }

      section{
        padding:60px 5vw;
      }

      .section-head{
        display:block;
      }

      .section-desc{
        margin-top:20px;
      }

      .project{
        min-height:390px;
      }

      .process-text{
        padding:32px;
      }

      .process-grid img{
        height:auto;
        border-radius:22px;
      }

      footer{
        padding-bottom:92px;
        display:block;
      }

      .sticky-mobile{
        display:flex;
        position:fixed;
        left:14px;
        right:14px;
        bottom:14px;
        z-index:40;
        justify-content:center;
        padding:15px 18px;
        border-radius:999px;
        background:#c8a667;
        color:#111;
        font-weight:600;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <nav class="nav">

    <div class="logo">
      ADEZO
      <small>EXCLUSIVE DOORS</small>
    </div>

    <div class="nav-links">
      <a href="#realizacje">Realizacje</a>
      <a href="#marka">Marka</a>
      <a href="#proces">Proces</a>
      <a href="#kontakt">Konsultacja</a>
    </div>

    <a href="#kontakt" class="nav-cta">
      Umów konsultację
    </a>

  </nav>

  <header class="hero">

    <div class="hero-copy">

      <div class="eyebrow">
        Drzwi wejściowe premium
      </div>

      <h1>
        Ekskluzywne drzwi wejściowe
      </h1>

      <p class="lead">
        Tworzymy wejścia premium dopasowane do architektury domu,
        stylu inwestycji i emocji pierwszego wrażenia.
      </p>

      <a href="#kontakt" class="text-cta">
        Umów konsultację premium →
      </a>

    </div>

    <div class="video-card" aria-label="Video ADEZO">

      <video
        controls
        playsinline
        preload="metadata"
        poster="assets/adezo-frame-1-1.jpg">

        <source
          src="assets/adezo-video-1.mp4"
          type="video/mp4">

      </video>

      <div class="play-note">
        Video ADEZO · kliknij play
      </div>

    </div>

  </header>

</div>

</body>
</html>
